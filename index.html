<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#087f5b">
<title>সততা সপ | অনলাইন শপ</title>
<style>
:root{--brand:#087f5b;--brand2:#065f46;--ink:#17211d;--muted:#66736d;--bg:#f5f8f6;--card:#fff;--line:#e0e8e3;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:11px 15px;font-weight:700}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#e8f3ed;color:var(--brand2)}.wrap{max-width:1150px;margin:auto;padding:16px}.top{background:#fff;border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;gap:14px;max-width:1150px;margin:auto;padding:14px 16px}.brandname{font-size:1.35rem;font-weight:850}.muted{color:var(--muted);font-size:.92rem}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.productImg{width:100%;aspect-ratio:1/1;object-fit:cover;background:#edf2ee}.pbody{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.pname{font-weight:750}.price{font-weight:850;color:var(--brand2)}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;margin:16px 0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:650;font-size:.93rem}.field input,.field select,.field textarea{width:100%;border:1px solid #cfdad3;border-radius:9px;padding:11px;background:#fff}.notice{padding:12px;border-radius:10px;background:#fff8df;color:#704f00;font-size:.92rem}.success{background:#e6f7ec;color:#17643a}.error{background:#ffeded;color:#8c1d18}.footer{text-align:center;color:var(--muted);padding:28px 10px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
</style>
</head>
<body>
<header class="top"><div class="head">
<div style="flex:1"><div class="brandname" id="storeName">সততা সপ</div><div class="muted">বিশ্বস্ত অনলাইন শপিং</div></div>
</div></header>
<main class="wrap">
<div class="bar"><input class="search" id="search" placeholder="পণ্যের নাম লিখে খুঁজুন..."></div>
<section><h2>আমাদের পণ্য</h2><div id="productGrid" class="grid"><div class="empty">পণ্য লোড হচ্ছে...</div></div></section>

<section class="panel" id="checkout">
<h2>অর্ডার ফর্ম</h2>
<div id="selectedProduct" class="notice">অর্ডার করতে পণ্যের কার্ডে “অর্ডার করুন” চাপুন।</div>
<form id="orderForm">
<div class="formgrid" style="margin-top:14px">
<div class="field"><label>আপনার নাম *</label><input id="customerName" required maxlength="100"></div>
<div class="field"><label>মোবাইল নম্বর *</label><input id="customerPhone" required maxlength="20" placeholder="01XXXXXXXXX"></div>
<div class="field full"><label>সম্পূর্ণ ঠিকানা *</label><textarea id="customerAddress" required maxlength="500"></textarea></div>
<div class="field full"><button id="submitOrder" type="submit">অর্ডার নিশ্চিত করুন</button><div id="orderMessage" aria-live="polite"></div></div>
</div>
</form>
</section>
</main>
<footer class="footer">© সততা সপ। সর্বস্বত্ব সংরক্ষিত।</footer>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = 'https://otxsvcrahrhsnfpvtimx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_MpV2AqwE_RcXzq8mzBhwcw_yTKkvnEA';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let products = [], chosenProduct = null;
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "৳" + Number(n || 0).toLocaleString("bn-BD");

function showMessage(text, type="notice") {
  $("orderMessageclassName").className = type;
  $("orderMessage").textContent = text;
}

async function loadProducts() {
  const { data, error } = await supabase.from('products').select('*').order('id', { ascending: false });
  if (error) { console.error(error); return; }
  products = data || [];
  renderProducts();
}

function renderProducts() {
  const query = $("search").value.trim().toLowerCase();
  const list = products.filter(p => (`${p.title || ""} ${p.description || ""}`).toLowerCase().includes(query));
  const host = $("productGrid");
  if (!list.length) { host.innerHTML = '<div class="empty">কোনো পণ্য পাওয়া যায়নি।</div>'; return; }
  host.innerHTML = "";
  list.forEach(p => {
    const card = document.createElement("article");
    card.className = "card";
    const img = p.image_url || "";
    card.innerHTML = `<img class="productImg" loading="lazy" src="${escapeHtml(img || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23edf2ee%22/%3E%3C/svg%3E')}"><div class="pbody"><div class="pname">${escapeHtml(p.title)}</div><div class="price">${money(p.price)}</div><button>অর্ডার করুন</button></div>`;
    card.querySelector("button").onclick = () => {
      chosenProduct = p;
      $("selectedProduct").textContent = `নির্বাচিত পণ্য: ${p.title} — ${money(p.price)}`;
      $("checkout").scrollIntoView({behavior:"smooth", block:"start"});
    };
    host.append(card);
  });
}

$("search").addEventListener("input", renderProducts);

$("orderForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!chosenProduct) { alert("আগে একটি পণ্য নির্বাচন করুন।"); return; }
  
  const button = $("submitOrder"); button.disabled = true; button.textContent = "অর্ডার পাঠানো হচ্ছে...";
  try {
    const { error } = await supabase.from('orders').insert([{
      customer_name: $("customerName").value.trim(),
      customer_phone: $("customerPhone").value.trim(),
      customer_address: $("customerAddress").value.trim(),
      product_name: chosenProduct.title,
      total_price: chosenProduct.price,
      status: 'Pending'
    }]);

    if (error) throw error;

    alert("আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে!");
    $("orderForm").reset(); chosenProduct = null;
    $("selectedProduct").textContent = "অর্ডার সফলভাবে জমা হয়েছে।";
  } catch (err) {
    console.error(err);
    alert("অর্ডার পাঠানো যায়নি। আবার চেষ্টা করুন।");
  } finally {
    button.disabled = false; button.textContent = "অর্ডার নিশ্চিত করুন";
  }
});

loadProducts();
</script>
</body>
</html>
